<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法人リサーチ AI</title><style>body{font:16px system-ui;background:#f2f5f9;color:#20354b;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:14px;margin:16px 0;border:1px solid #dce4ed}button,input,textarea{font:inherit}button{background:#174e78;color:white;border:0;padding:13px 20px;border-radius:9px;margin:5px;cursor:pointer}button:disabled{opacity:.4}textarea{width:100%;box-sizing:border-box}small{color:#53667a}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;min-width:100px}th{background:#eaf0f6}a{color:#174e78}.scroll{overflow:auto}#status{white-space:pre-wrap}h1{margin-bottom:0}input{max-width:100%}</style><main><h1>法人リサーチ AI</h1><small>PRIVATE WORKSPACE / Ver.0.6</small><section><h2>01 資料を登録</h2><input id="files" type="file" multiple accept=".pdf,.docx,.xlsx,.csv,.txt,.png,.jpg,.jpeg,.webp"><p>PDF・Word・Excel・画像（公開資料のみ）</p><textarea id="paste" rows="3" placeholder="名簿のテキストを貼り付ける場合はこちら"></textarea><p><label><input type="checkbox" id="consent"> 公開資料のみ使用し、Google無料APIのデータ利用条件を確認しました</label></p><button id="start">自動調査開始</button><button id="stop" disabled>停止</button><p id="status" aria-live="polite">資料を選択してください。</p></section><section><h2>02 調査結果</h2><button id="csv">CSV出力</button><button id="clear">履歴削除</button><div id="out" class="scroll"></div></section></main><script type="module" src="app.js"></script></html>
